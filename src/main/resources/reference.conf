# MySQL CDC 引擎默认配置

cdc {
  # CDC 任务名称，用于区分不同的 CDC 任务
  # 多个任务可以共享同一个元数据库，通过 task-name 区分
  task-name = "default-cdc-task"

  # 源数据库配置
  source {
    host = "localhost"
    port = 3306
    username = "cdc_user"
    password = "cdc_password"
    password = ${?CDC_SOURCE_PASSWORD}
    database = "test"

    connection-pool {
      max-pool-size = 10
      min-idle = 2
      connection-timeout = 30s
    }

     # 启用 Debezium
     use-debezium = true
     debezium {
         snapshot-mode = "never"
         # 只监听这两张表
         table-include-list = "test.users,test.orders"
         max-batch-size = 2048
         errors-max-retries = 3
     }
  }

  # 目标数据库配置
  target {
    host = "localhost"
    port = 3307
    username = "cdc_user"
    password = "cdc_password"
    password = ${?CDC_TARGET_PASSWORD}
    database = "test_target"

    connection-pool {
      max-pool-size = 20
      min-idle = 5
      connection-timeout = 30s
    }
  }

  # 元数据库配置
  # 用于存储 CDC 偏移量等元数据，与业务数据分离
  # 多个 CDC 任务可以共享同一个元数据库
  metadata {
    host = "localhost"
    port = 3307
    username = "cdc_user"
    password = "cdc_password"
    password = ${?CDC_METADATA_PASSWORD}
    database = "xxt_cdc"

    connection-pool {
      max-pool-size = 5
      min-idle = 1
      connection-timeout = 30s
    }
  }

  # 表过滤配置
  filter {
    include-databases = []
    exclude-databases = ["information_schema", "mysql", "performance_schema", "sys"]
    include-table-patterns = []
    exclude-table-patterns = []
  }

  # 并行度配置
  parallelism {
    partition-count = 64
    apply-worker-count = 8
    snapshot-worker-count = 4
    batch-size = 100
    flush-interval = 1s
  }

  # 偏移量配置
  offset {
    store-type = "mysql"  # mysql 或 file
    commit-interval = 5s
    start-from-latest = true  # true=从最新位置开始（跳过历史），false=从头开始
    enable-snapshot = false  # 默认关闭；建议测试验证后再启用 Snapshot/Catchup

    # MySQL 存储配置
    mysql {
      table-name = "cdc_offsets"
    }

    # 文件存储配置
    file {
      path = "./data/offsets"
    }
  }
}

# Pekko 配置（Phase 1: 切换到 Cluster provider）
pekko {
  loglevel = "INFO"

  actor {
    provider = "cluster"

    # Cluster gossip / sharding / pub-sub 跨节点消息序列化绑定。
    # 不能绑 java.io.Serializable（开放接口，Pekko 安全拒绝），
    # 项目自己需要跨节点传递的消息一律继承 cn.xuyinyin.cdc.CborSerializable。
    serialization-bindings {
      "cn.xuyinyin.cdc.CborSerializable" = jackson-cbor
    }
  }

  # Artery 远程通信（替代旧版 Netty TCP）
  remote {
    artery {
      transport = tcp
      canonical {
        hostname = "127.0.0.1"
        hostname = ${?PEKKO_REMOTE_HOSTNAME}
        port = 2551
        port = ${?PEKKO_REMOTE_PORT}
      }
    }
  }

  # Cluster 配置
  # 节点角色（master / worker），可通过 CLI --role 覆盖
  cluster {
    roles = ["worker"]

    # 种子节点列表，由 CDCApplication 根据 --seed-nodes 命令行参数注入
    seed-nodes = []

    # Split-Brain Resolver：网络分裂时保留多数派
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver {
      active-strategy = "keep-majority"
      stable-after = 20s
    }

    # 节点失活探测（容忍短暂 GC 暂停）
    failure-detector {
      acceptable-heartbeat-pause = 6s
      threshold = 12.0
    }

    # 节点离开后保留时间（避免短暂网络抖动直接 down）
    down-removal-margin = 10s
  }

  stream {
    materializer {
      # 流处理缓冲区配置
      max-input-buffer-size = 256
      initial-input-buffer-size = 4
    }
  }
}
